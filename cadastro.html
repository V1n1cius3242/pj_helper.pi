<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/stylecadastro.css">
    <link rel="shortcut icon" href="/icon/IconPJ.png">
    
    <title>PJ Helper - Cadastro</title>
</head>
<body>
    <div class="header">
        <img class="iconimg" src="/icon/LogoPJ.png" alt="Logo">
        <input type="checkbox" id="menu-toggle" style="display: none;">

        <label for="menu-toggle" class="menu-icon-hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav>
            <a class="navitens" href="homepage.html">Home</a>
            <a class="navitens" href="catalogo.html">Clientes</a>
            <a class="navitens" href="paginasobre.html">Sobre</a>
            <button onclick="window.location.href='login.html'" class="shiny-cta1">
                <span class="shiny-cta-content1">Login</span>
            </button>
        </nav>
    </div>

    <!-- CARROSSEL DE FUNDO (FIXO) -->
    <div class="itenscarrossel">
        <div class="carrossel">
            <img src="icon/padrao1.jpg" alt="">
            <img src="icon/padrao2.jpg" alt="">
            <img src="icon/padrao3.jpg" alt="">
        </div>
    </div>

 
        <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="contbox escondido">
            
            <div class="iconcad">
                <img src="./icon/IconPJ.png" alt="Icone PJ Helper">
                <h2>Criar conta</h2>
                <p>Cadastre-se na PJ Helper</p>
            </div>
            
            <!-- Restante do formulário permanece igual -->

            <form id="formCadastro">
                
                <div class="campo">
                    <label for="tipo">Tipo de Conta:</label>
                    <select id="tipo" required>
                        <option value="" disabled selected>Selecione o tipo de conta</option>
                        <option value="mei">MEI (Prestador de Serviço)</option>
                        <option value="empresa">Empresa / Contratante</option>
                        <option value="admin">Administrador (ADM)</option>
                    </select>
                </div>

                <!-- CAMPO ESCONDIDO DE ADM -->
                <div class="campo" id="boxChaveAdmin" style="display: none;">
                    <label for="chaveAdmin" style="color: #d9534f; font-weight: bold;">Chave de Acesso ADM:</label>
                    <input type="password" maxlength="150" id="chaveAdmin" placeholder="Digite a chave de segurança">
                </div>

                <div class="campo">
                    <label for="razao_social">Razão Social:</label>
                    <input type="text" id="razao_social" placeholder="Nome da empresa" maxlength="150" required>
                </div>

               <div class="campo">
                   <label for="cnpj">CNPJ:</label>
                   <input 
                   type="text" 
                   id="cnpj" 
                   placeholder="00.000.000/0001-00" 
                   maxlength="18" 
                   required 
                   oninput="mascaraCNPJ(this)">
               </div>

                <div class="campo">
                    <label for="nome_responsavel">Nome do Responsável:</label>
                    <input type="text" id="nome_responsavel" placeholder="Nome completo" maxlength="150" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" maxlength="150" required placeholder="exemplo@mei.com">
                </div>

                <div class="campo">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" required>
                        <option value="" disabled selected>Selecione...</option>
                        <option value="Tecnologia">Tecnologia / TI</option>
                        <option value="Manutenção">Manutenção e Serviços</option>
                        <option value="Design">Design e Marketing</option>
                        <option value="Consultoria">Consultoria</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="descricao_servico">Descrição do Serviço:</label>
                    <textarea 
                        id="descricao_servico" 
                        rows="3" 
                        maxlength="500" 
                        placeholder="Descreva brevemente o que você oferece..."
                        oninput="this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px';"></textarea>
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" maxlength="150" required placeholder="No mínimo 6 caracteres.">
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar Senha:</label>
                    <input type="password" id="confirmar_senha" required placeholder="Repita a senha">
                </div>

                <button type="submit" id="btnCadastrar">Criar conta</button>
            </form>

            <p id="mensagem" style="margin-top:15px; font-weight:bold;"></p>

            <div style="margin-top: 15px; text-align: center;">
                <a href="login.html" style="color: #3faf6e;">Já possui uma conta? Faça login</a>
            </div>

        </div>
    </main>

    <footer class="footer">
        <section class="bloco2footer">
            <div class="footer-icon"><img src="/icon/IconPJ.png" alt="Icone PJ Helper"></div>
            <div class="footer-text1"><h3>PJ <span style="color: #3faf6e;">HELPER</span></h3></div>
            <div class="footer-text2">
                <p>Soluções inteligentes que simplificam a rotina do seu CNPJ. <br>
                O parceiro ideal para você focar apenas no que importa: o seu crescimento.</p>
            </div>
        </section>

        <section class="linhafooter">
            <div class="linha"></div>
            <p class="direitosautorais">© 2026 PJ Helper. Todos os direitos reservados.</p>
        </section>
    </footer>

    <script src="./js/scriptCAD.js"></script>
</body>
</html>
